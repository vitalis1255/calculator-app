<!DOCTYPE html>
<html>
  <head>
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container-all">
      <h1 class="heading">Izuchukwu Scientific Calculator</h1>
      <div class="myLabels">
       <label class="label12">
         <input type="text" class="js-num1 num1" name="num1" placeholder="Enter two numbers separated by a comma: ">
        </label>
      </div>
      <div class="result">
       <input class="js-result result-display">
      </div>
      <div class="myButtons"></div>
      <div class="trigonometry">
        <div>
          <button class="js-sin sin">Sin</button>
        </div>
        <div>
          <button class="js-cos cos">Cos</button>
        </div>
        <div>
          <button class="js-tan tan">Tan</button>
        </div>
        <div id="mult-division">
          <div>
            <button class="js-multiply mult">X</button>
          </div>
          <div>
            <button class="js-divide-button divide">/</button>
          </div>
        </div>
      </div>

      <div class="trigonometry-inverse">
        <div>
          <button class="js-asine asine">sin^-1</button>
        </div>
        <div>
          <button class="js-acose acose">cos^-1</button>
        </div>
        <div>
          <button class="js-atan atane">tan^-1</button>
        </div>

        <div id="plus-minus">
          <div>
            <button class="js-add-button add">+</button>
          </div>
          <div>
            <button class="buttonSub js-sub-button">-</button>
          </div>
        </div>
      </div>
      <div class="nums-zero-nine">
        <div id="seven-eight-nine">
          <div>
            <button class="js-seven seven">7</button>
          </div>
          <div>
            <button class="js-eight eight">8</button>
          </div>
          <div>
            <button class="js-nine nine">9</button>
          </div>
          <div>
          <button class="js-e e-to-ten">e</button>
        </div>
        <div>
           <button class="js-pi pi">PI</button>
        </div>
        </div>
      </div>

      <div id="nums-four-six">
        <div>
          <button class="js-four four">4</button>
        </div>
        <div>
          <button class="js-five five">5</button>
        </div>
        <div>
          <button class="js-six six">6</button>
        </div>
        <div>
          <button class="js-log2 log2">lg2</button>
        </div>
        <div>
          <button class="js-logarithm logarithm">lg10</button>
        </div>
      </div>

      <div class="nums-one-to-three">
        <div>
          <button class="js-num-one num-one">1</button>
        </div>
        <div>
          <button class="js-num-two num-two">2</button>
        </div>
        <div>
          <button class="js-num-three num-three">3</button>
        </div>
        <div>
          <button class="js-log-basex-raise-to-y log-basex-raise-to-y">lgx^y</button>
        </div>
        <div>
          <button class="js-e-raise-to-power-x e-raise-to-x">e^x</button>
        </div>
      </div>

      <div class="nums-zero-to-dot-exp">
        <div>
          <button class="js-num-zero num-zero">0</button>
        </div>
        <div>
          <button class="js-dot-button dot-button">o</button>
        </div>
        <div>
          <button class="js-exp exp">Exp</button>
        </div>
      </div>

      <div class="root">
        <div>
          <button class="js-square square-root">sqrt</button>
        </div>
        <div>
          <button class="js-raise-power raise-to-power-any-num">x^y</button>
        </div>
        <div>
          <button class="js-natural-log natural-log">ln</button>
        </div>
        <div>
          <button class="js-x-raise-to-power-3 x-raise-to-power-3">x^3</button>
        </div>
        <div>
          <button class="js-x-raise-to-power-2 x-raise-to-power-2">x^2</button>
        </div>
        <div>
          <button class="js-comma-button comma-button">,</button>
        </div>
      </div>

      <div class="roots-any-num">
        <div>
          <button class="js-x-raise-to-power-minus-one x-raise-to-power-minus-one">x^-1</button>
        </div>
        <div>
          <button class="js-three-sqrt-x three-sqrt-to-power-x">3sqrtx</button>
        </div>
        <div>
          <button class="js-x-sqrt-y x-sqrt-y">xsqrty</button>
        </div>
        <div>
          <button class="js-module modulus">%</button>
        </div>
      </div>

      <div id="pi-clear">
        <div class="js-reset reset">
         <button class="reset-button">Clear</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
