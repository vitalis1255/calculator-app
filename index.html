<!DOCTYPE html>
<html>
  <head>
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container-all">
      <h1 class="heading">Izuchukwu Scientific Calculator</h1>
      <div class="myLabels">
       <label class="label12">
         <input type="text" class="js-num1 num1" name="num1" placeholder="Enter two nums sep by a comma: ">
        </label>
      </div>
      <div class="result">
       <input class="js-result result-display">
      </div>
      <div class="trigonometry">
        <div>
          <button class="js-sin sin">sin&theta;</button>
        </div>
        <div>
          <button class="js-cos cos">cos&theta;</button>
        </div>
        <div>
          <button class="js-tan tan">tan&theta;</button>
        </div>
        <div>
          <button class="js-asine asine">sin<sup>-1</sup></button>
        </div>
        <div>
          <button class="js-acose acose">cos<sup>-1</sup></button>
        </div>
        <div>
          <button class="js-atan atane">tan<sup>-1</sup></button>
        </div>
      </div>
        <div id="seven-eight-nine">
          <div>
            <button class="js-seven seven">7</button>
          </div>
          <div>
            <button class="js-eight eight">8</button>
          </div>
          <div>
            <button class="js-nine nine">9</button>
          </div>
          <div>
           <button class="js-e e-to-ten">&ExponentialE;</button>
          </div>
          <div>
           <button class="js-pi pi">&pi;</button>
          </div>
          <div>
           <button class="js-exp exp">Exp</button>
          </div>
        </div>
      

      <div id="nums-four-six">
        <div>
          <button class="js-four four">4</button>
        </div>
        <div>
          <button class="js-five five">5</button>
        </div>
        <div>
          <button class="js-six six">6</button>
        </div>
        <div>
          <button class="js-log2 log2">log<sub>2</sub>x</button>
        </div>
        <div>
          <button class="js-logarithm logarithm">log<sub>10</sub>x</button>
        </div>
        <div>
          <button class="js-square square-root">&Sqrt;</button>
        </div>
      </div>

      <div class="nums-one-to-three">
        <div>
          <button class="js-num-one num-one">1</button>
        </div>
        <div>
          <button class="js-num-two num-two">2</button>
        </div>
        <div>
          <button class="js-num-three num-three">3</button>
        </div>
        <div>
          <button class="js-log-basex-raise-to-y log-basex-raise-to-y">log<sub>x</sub>y</button>
        </div>
        <div>
          <button class="js-e-raise-to-power-x e-raise-to-x">e<sup>x</sup></button>
        </div>
        <div>
          <button class="js-raise-power raise-to-power-any-num">x<sup>y</sup></button>
        </div>
      </div>

      <div class="nums-zero-to-dot-exp">
        <div>
          <button class="js-num-zero num-zero">0</button>
        </div>
        <div>
          <button class="js-dot-button dot-button">o</button>
        </div>
        <div>
          <button class="js-natural-log natural-log">&#13265</button>
        </div>
        <div>
          <button class="js-x-raise-to-power-3 x-raise-to-power-3">x<sup>3</sup></button>
        </div>
        <div>
          <button class="js-x-raise-to-power-2 x-raise-to-power-2">x<sup>2</sup></button>
        </div>
        <div>
          <button class="js-three-sqrt-x three-sqrt-to-power-x">&#8731</button>
        </div>
      </div>
      <div class="arithmetic">
        <div>
          <button class="js-multiply mult">&times;</button>
        </div>
        <div>
          <button class="js-divide-button divide">&divide;</button>
        </div>
        <div>
          <button class="js-add-button add">&plus;</button>
        </div>
        <div>
          <button class="buttonSub js-sub-button">&minus;</button>
        </div>
        <div>
          <button class="js-comma-button comma-button">&#44;</button>
        </div>
        <div>
          <button class="js-x-sqrt-y x-sqrt-y"><sup>x</sup> &radic; y</button>
        </div>
      </div>

      <div class="roots-any-num">
        <div>
          <button class="js-x-raise-to-power-minus-one x-raise-to-power-minus-one">x<sup>-1</sup></button>
        </div>
        <div>
          <button class="js-module modulus">&percnt;</button>
        </div>
        <div>
         <button class="js-reset reset reset-button">Clear</button>
        </div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
